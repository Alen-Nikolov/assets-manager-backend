spring.application.name=assets-manager-backend

# PostgreSQL - resolved from environment variables at startup (set these on the hosting service).
# DB_USERNAME / DB_PASSWORD have no defaults on purpose. For local dev, put them in the git-ignored config/application.properties.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/assets-manager}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Dev-friendly schema management. Switch to Flyway/Liquibase migrations + "validate" before production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Image uploads (stored in the database)
spring.servlet.multipart.max-file-size=${MAX_IMAGE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_IMAGE_SIZE:5MB}

# Frontend origins allowed to call /api/** (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health,info
